name: Throne build matrix
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag and version"
        required: true
      publish:
        description: "r for normal release, p for prerelease, leave empty to not publish anything"
        required: false
      notarize:
        description: "yes to notarize the macOS build, no to ship it signed only"
        required: false
        default: "yes"
      sign:
        description: "yes to sign the macOS build with the Developer ID, no for the ad-hoc signature"
        required: false
        default: "no"
env:
  # thronectl's source for the headless smoke test and the Docker image; the commit must be pushed to throneproj/Throne-api.
  # A THRONE_API_REF repository variable overrides it.
  THRONE_API_REF: ${{ vars.THRONE_API_REF || 'cd3e77bd2e60e025924fd7ba287f04aa71c4526c' }}
jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Checking the engine/UI boundary
        run: cmake -DROOT=${{ github.workspace }} -P cmake/EngineBoundary.cmake
  build-go:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - cross_os: windows
            cross_arch: amd64
            go_version: "1.27.2"
            runner: ubuntu-22.04
          - cross_os: windows
            cross_arch: arm64
            go_version: "1.27.2"
            runner: ubuntu-22.04
          - cross_os: linux
            cross_arch: amd64
            go_version: "1.27.2"
            runner: ubuntu-22.04
          - cross_os: linux
            cross_arch: arm64
            go_version: "1.27.2"
            runner: ubuntu-22.04
          - cross_os: darwin
            cross_arch: amd64
            go_version: "1.27.2"
            runner: macos-latest
          - cross_os: darwin
            cross_arch: arm64
            go_version: "1.27.2"
            runner: macos-latest
          - cross_os: darwinlegacy
            cross_arch: amd64
            go_version: "1.27.2"
            runner: macos-latest
          - cross_os: windowslegacy
            cross_arch: amd64
            go_version: "1.27.2"
            runner: macos-latest
          - cross_os: windowslegacy
            cross_arch: 386
            go_version: "1.27.2"
            runner: macos-latest
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    env:
      DEST: ${{ github.workspace }}/deployment/${{ matrix.cross_os }}-${{ matrix.cross_arch }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Cache Common Download
        id: cache-common
        uses: actions/cache@v6.1.0
        with:
          path: artifacts.tgz
          key: CommonCache-${{ matrix.cross_os }}-${{ matrix.cross_arch }}-${{ hashFiles('script/build_go.sh', 'core/**') }}-${{ matrix.go_version }}
      - name: Install Golang
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go_version }}
          cache-dependency-path: |
            core/go.sum
      - name: Install Golang For Legacy OS
        if: steps.cache-common.outputs.cache-hit != 'true' && contains( matrix.cross_os, 'legacy' )
        run: |
          # MetaCubeX/go restores Win7 / macOS 10.15 support; stay on 1.26 since Go 1.27 drops macOS < 13
          mkdir -p golang.org
          curl -fL "https://github.com/MetaCubeX/go/releases/download/build/go1.26.$(go env GOHOSTOS)-$(go env GOHOSTARCH).tar.gz" | tar -xz -C golang.org
      - name: Install Protoc
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Installing protoc-gen-go
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Clone cronet-go
        if: matrix.cross_os == 'linux'
        run: |
          set -xeuo pipefail
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/throneproj/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "2ee86b72426042457b8eb879ab32296f5752bf2f"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1
      - name: Download Chromium toolchain
        if: matrix.cross_os == 'linux'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.cross_arch }} download-toolchain
      - name: Set Chromium toolchain environment
        if: matrix.cross_os == 'linux'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.cross_arch }} env >> $GITHUB_ENV
      - name: Build golang parts
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: |
          GOOS=${{ matrix.cross_os }} GOARCH=${{ matrix.cross_arch }} ./script/build_go.sh
      - name: Tar files
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Throne-${{ github.sha }}-Common-${{ matrix.cross_os }}-${{ matrix.cross_arch }}
          path: artifacts.tgz
          compression-level: 0
  build-cpp:
    permissions:
      contents: read
    needs:
      - lint
      - build-go
    strategy:
      matrix:
        include:
          - platform: windows-latest
            qt_version: "6.12.0"
            target: x64
            dest_suffix: windows-amd64
            common: windows-amd64
            launcher: sccache
          - platform: windows-11-arm
            qt_version: "6.12.0"
            target: arm64
            dest_suffix: windows-arm64
            common: windows-arm64
            launcher: ""
          - platform: ubuntu-22.04
            qt_version: "6.12.0"
            target: x86_64
            dest_suffix: linux-amd64
            common: linux-amd64
            launcher: ccache
          - platform: ubuntu-22.04
            qt_version: "6.2.0"
            target: x86_64
            dest_suffix: linux-amd64-system-qt
            common: linux-amd64
            launcher: ccache
          - platform: ubuntu-24.04-arm
            qt_version: "6.12.0"
            target: aarch64
            dest_suffix: linux-arm64
            common: linux-arm64
            launcher: ccache
          - platform: ubuntu-22.04-arm
            qt_version: "6.2.0"
            target: aarch64
            dest_suffix: linux-arm64-system-qt
            common: linux-arm64
            launcher: ccache
          - platform: macos-latest
            qt_version: "6.12.0"
            target: x86_64
            dest_suffix: darwin-amd64
            common: darwin-amd64
            launcher: ccache
          - platform: macos-latest
            qt_version: "6.12.0"
            target: arm64
            dest_suffix: darwin-arm64
            common: darwin-arm64
            launcher: ccache
          - platform: macos-15
            qt_version: "6.4.3"
            target: x86_64
            dest_suffix: darwinlegacy-amd64
            common: darwinlegacy-amd64
            launcher: ccache
          - platform: windows-latest
            qt_version: "6.2.13"
            target: x64
            dest_suffix: windowslegacy-amd64
            common: windowslegacy-amd64
            launcher: sccache
          - platform: windows-2022
            qt_version: "6.2.13"
            target: x86
            dest_suffix: windowslegacy-386
            common: windowslegacy-386
            launcher: sccache
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    env:
      INPUT_VERSION: ${{ github.event.inputs.tag }}
      DEST: ${{ github.workspace }}/deployment/${{ matrix.dest_suffix }}
      DEST_SUFFIX: ${{ matrix.dest_suffix }}
      ARCH: ${{ matrix.target }}
      LAUNCHER_ARGS: ${{ matrix.launcher != '' && format('-DCMAKE_C_COMPILER_LAUNCHER={0} -DCMAKE_CXX_COMPILER_LAUNCHER={0}', matrix.launcher) || '' }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Checking out the web dashboard
        uses: actions/checkout@v7.0.1
        with:
          repository: SagerNet/sing-box-dashboard
          ref: gh-pages
          path: dashboard-src
      - name: Bundling the web dashboard
        shell: bash
        run: |
          # Read-only pack files make this flaky on Windows; cmake filters .git out anyway.
          rm -rf dashboard-src/.git || true
          cp -R dashboard-src/. res/dashboard/
          # cmake globs res/dashboard at configure time and silently ships nothing if it
          # is empty, so fail here instead of releasing a build without the dashboard.
          test -f res/dashboard/index.html
      - name: Install MSVC compiler
        if: contains( matrix.platform, 'windows' )
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target }}
      - name: Setup compiler cache
        if: matrix.launcher != ''
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.dest_suffix }}-${{ matrix.qt_version }}
          variant: ${{ matrix.launcher }}
          max-size: 500M
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: Throne-${{ github.sha }}-Common-${{ matrix.common }}
          path: download-artifact
      # ========================================================================================================= Qt Install
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        if: (!contains(matrix.platform, 'windows')) && matrix.qt_version != '6.2.0'
        with:
          version: ${{ matrix.qt_version }}
          setup-python: true
          cache: true
          cache-key-prefix: QtCache-${{ matrix.dest_suffix }}
      # ========================================================================================================= Generate MakeFile and Build
      - name: Windows - Cache Qt and OpenSSL
        id: cache-winqt
        if: contains( matrix.platform, 'windows' )
        uses: actions/cache@v6.1.0
        with:
          path: |
            qt.7z
            openssl.7z
          key: WinQt-${{ matrix.qt_version }}-${{ matrix.target }}
      - name: Windows - Download Qt and OpenSSL
        shell: bash
        if: contains( matrix.platform, 'windows' ) && steps.cache-winqt.outputs.cache-hit != 'true'
        run: |
          curl -L -o qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_${{ matrix.qt_version }}/Qt_${{ matrix.qt_version }}_${{ matrix.target }}.7z
          curl -L -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_${{ matrix.target }}.7z
      - name: Windows - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'windows' )
        run: |
          7z x qt.7z
          7z x openssl.7z
          export CMAKE_PREFIX_PATH=$PWD/Qt/lib/cmake
          export OPENSSL_ROOT_DIR=$PWD/openssl
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_windows.sh
      - name: Linux - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'ubuntu' ) && matrix.qt_version != '6.2.0'
        run: |
          sudo apt update
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_linux64.sh
          # Один файл на все дистрибутивы: ни пакетов, ни установки. Имя
          # архитектуры у матрицы и у AppImage совпадает — x86_64 и aarch64.
          ./script/make_appimage.sh "$DEST" "$DEST/../FSNT-Client-${{ matrix.target }}.AppImage" "${{ matrix.target }}"
      - name: Linux Using System Qt - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'ubuntu' ) && matrix.qt_version == '6.2.0'
        run: |
          sudo apt update
          sudo apt install -y qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6-dev qt6-translations-l10n libglx-dev libgl1-mesa-dev
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc" $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_linux64_system_qt.sh
      - name: macOS - Import signing certificate
        shell: bash
        if: contains( matrix.platform, 'macos' )
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: ./script/import_macos_cert.sh
      - name: macOS - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'macos' )
        env:
          MACOS_SIGN_IDENTITY: ${{ github.event.inputs.sign == 'yes' && secrets.MACOS_SIGN_IDENTITY || '' }}
          MACOS_NOTARIZE: ${{ github.event.inputs.notarize }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNKR_PACKAGE_MACOS=1 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_OSX_ARCHITECTURES=${{ matrix.target }} $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_macos.sh
          # Приложение заверяем до образа: талон должен лежать внутри бандла, а
          # не только на образе, иначе вытащенная в Программы копия на первом
          # запуске идёт за проверкой к Apple по сети.
          ./script/notarize_macos.sh "$DEST/Throne.app"
          # Образ собираем здесь: упаковка релиза идёт на Linux, а hdiutil есть
          # только на маке.
          ./script/make_dmg.sh "$DEST/Throne.app" "$DEST/FSNT-Client.dmg"
          ./script/notarize_macos.sh "$DEST/FSNT-Client.dmg"
      # ========================================================================================================= Deployments
      - name: Tar files
        shell: bash
        run: tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Throne-${{ github.sha }}-${{ matrix.dest_suffix }}
          path: artifacts.tgz
          compression-level: 0
  pack:
    name: Pack ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs:
      - build-cpp
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: windows
            runner: windows-latest
            artifacts: "windows*"
          # glibc: <deployment dir>=<glibc of the build-cpp image it was built on>, the highest GLIBC_ version it may need.
          - target: linux-amd64
            runner: ubuntu-latest
            artifacts: "linux-amd64*"
            tools: rpm
            glibc: "linux-amd64=2.35 linux-amd64-system-qt=2.35"
          - target: linux-arm64
            runner: ubuntu-latest
            artifacts: "linux-arm64*"
            tools: rpm
            glibc: "linux-arm64=2.39 linux-arm64-system-qt=2.35"
          - target: macos
            runner: ubuntu-latest
            artifacts: "darwin*"
          - target: debug
            runner: ubuntu-latest
            artifacts: "*"
      fail-fast: false
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Throne-${{ github.sha }}-${{ matrix.artifacts }}
          path: download-artifact
      - name: Install packaging tools
        if: matrix.tools
        run: sudo apt install ${{ matrix.tools }}
      - name: Pack
        shell: bash
        run: bash ./script/pack_release.sh ${{ matrix.target }} "${{ github.event.inputs.tag }}"
      # Pins each build's glibc floor: a build image bump that raises it fails here, not in an older system's loader.
      - name: Checking glibc symbol versions
        if: matrix.glibc
        shell: bash
        env:
          GLIBC_LIMITS: ${{ matrix.glibc }}
        run: |
          rc=0
          for entry in $GLIBC_LIMITS; do
            dir=${entry%%=*}
            limit=${entry#*=}
            for bin in Throne ThroneCore; do
              file="deployment/$dir/$bin"
              if [ ! -f "$file" ]; then
                echo "::error::$file is missing"
                rc=1
                continue
              fi
              # readelf, unlike this runner's objdump, reads arm64 binaries too.
              need=$(readelf -V -W "$file" | { grep -o 'GLIBC_[0-9][0-9.]*' || true; } | sed 's/^GLIBC_//' | sort -Vu | tail -n1)
              printf '%-24s %-11s GLIBC_%-7s limit %s\n' "$dir" "$bin" "${need:-none}" "$limit"
              if [ -n "$need" ] && [ "$(printf '%s\n' "$need" "$limit" | sort -V | tail -n1)" != "$limit" ]; then
                echo "::error::$dir/$bin needs GLIBC_$need, newer than the $limit of the image it was built on"
                rc=1
              fi
            done
          done
          exit $rc
      - name: Uploading Artifact
        if: matrix.target != 'debug'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Pack-${{ github.sha }}-${{ matrix.target }}
          # FSNT-Client-*: установщик, образы macOS и AppImage — их скачивают люди
          # и на их имена ссылается обновлятор.
          path: |
            deployment/Throne-*
            deployment/FSNT-Client-*
          if-no-files-found: error
          compression-level: 0
      - name: Uploading Debug Artifact
        if: matrix.target == 'debug'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Debug-${{ github.sha }}
          path: deployment/debug-symbols.zip
          if-no-files-found: error
          compression-level: 0
  # Installs a .deb into a bare Debian container and loads both binaries there, so a dependency the package does not
  # declare fails here instead of in a user's dynamic loader.
  package-smoke:
    name: Package smoke ${{ matrix.deb }} in ${{ matrix.image }}
    runs-on: ${{ matrix.runner }}
    needs:
      - pack
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - deb: debian-amd64
            pack: linux-amd64
            image: debian:12
            runner: ubuntu-latest
          # Raspberry Pi OS bookworm (glibc 2.36) takes the system-qt build; this is the arm runner that builds it.
          - deb: debian-arm64-system-qt
            pack: linux-arm64
            image: debian:bookworm-slim
            runner: ubuntu-22.04-arm
      fail-fast: false
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: Pack-${{ github.sha }}-${{ matrix.pack }}
          path: download-artifact
      - name: Installing and running the package
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag }}
          DEB: Throne-${{ github.event.inputs.tag }}-${{ matrix.deb }}.deb
          IMAGE: ${{ matrix.image }}
        run: |
          if [ ! -f "download-artifact/$DEB" ]; then
            echo "::error::$DEB is not in Pack-${{ github.sha }}-${{ matrix.pack }}"
            exit 1
          fi
          docker run --rm -e TAG -e DEB -e IMAGE -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD/download-artifact:/pkg:ro" "$IMAGE" bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y --no-install-recommends "/pkg/$DEB"
            rc=0
            for bin in /opt/Throne/Throne /opt/Throne/ThroneCore; do
              echo "::group::ldd $bin"
              out=$(ldd "$bin" 2>&1) || true
              echo "$out"
              echo "::endgroup::"
              if grep -F "not found" <<<"$out"; then
                echo "::error::$bin does not load in $IMAGE: the package misses a dependency"
                rc=1
              fi
            done
            [ "$rc" = 0 ] || exit 1
            version=$(/opt/Throne/Throne --headless --version)
            echo "$version"
            if [ "$version" != "Throne $TAG" ]; then
              echo "::error::Throne --headless --version printed \"$version\", not \"Throne $TAG\""
              exit 1
            fi
          '
  # Builds the headless image for linux/amd64 and linux/arm64 from the packed linux zips and runs both; pushes it to
  # ghcr.io only when publishing: the tag for p and r, plus latest for r.
  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    needs:
      - pack
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag }}
      PUBLISH: ${{ github.event.inputs.publish }}
      CONTEXT: ${{ github.workspace }}/docker-context
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Pack-${{ github.sha }}-linux-*
          merge-multiple: true
          path: download-artifact
      # The context mirrors deployment/: linux-<arch>/ holds what the release zip's Throne/ holds.
      - name: Preparing the build context
        id: context
        shell: bash
        run: |
          rm -rf "$CONTEXT"
          mkdir -p "$CONTEXT"
          for arch in amd64 arm64; do
            zip="download-artifact/Throne-$TAG-linux-$arch.zip"
            if [ ! -f "$zip" ]; then
              echo "::error::$zip is missing"
              exit 1
            fi
            unzip -q "$zip" -d "$RUNNER_TEMP/zip-$arch"
            mv "$RUNNER_TEMP/zip-$arch/Throne" "$CONTEXT/linux-$arch"
            # The amd64 runner would run a misplaced amd64 binary natively in the arm64 image, so --version cannot tell.
            machine=$([ "$arch" = amd64 ] && echo x86-64 || echo aarch64)
            for bin in Throne ThroneCore; do
              case "$(file -b "$CONTEXT/linux-$arch/$bin")" in
              *"$machine"*) ;;
              *)
                echo "::error::linux-$arch/$bin is not an $machine binary"
                exit 1
                ;;
              esac
            done
          done
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/throne"
          push=false
          tags=
          if [ "$PUBLISH" = p ] || [ "$PUBLISH" = r ]; then
            if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::'$TAG' cannot be a Docker image tag"
              exit 1
            fi
            push=true
            tags="$image:$TAG"
            if [ "$PUBLISH" = r ]; then
              tags="$tags,$image:latest"
            fi
          fi
          echo "push=$push" >>"$GITHUB_OUTPUT"
          echo "tags=$tags" >>"$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      # One platform per build so each can be loaded and run; the multi-platform push below reuses their cache.
      - name: Building the amd64 image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: docker/Dockerfile
          build-args: THRONE_API_REF=${{ env.THRONE_API_REF }}
          platforms: linux/amd64
          load: true
          tags: throne-ci:amd64
      - name: Building the arm64 image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: docker/Dockerfile
          build-args: THRONE_API_REF=${{ env.THRONE_API_REF }}
          platforms: linux/arm64
          load: true
          tags: throne-ci:arm64
      # The entrypoint already passes --headless.
      - name: Running both images
        shell: bash
        run: |
          for arch in amd64 arm64; do
            version=$(docker run --rm --platform "linux/$arch" "throne-ci:$arch" --version)
            echo "linux/$arch: $version"
            if [ "$version" != "Throne $TAG" ]; then
              echo "::error::linux/$arch: --version printed \"$version\", not \"Throne $TAG\""
              exit 1
            fi
            docker run --rm --platform "linux/$arch" --entrypoint thronectl "throne-ci:$arch" version
          done
      # amd64 only: under QEMU the arm64 start is too slow for a stable deadline.
      - name: Starting the amd64 image, connecting thronectl, stopping it
        shell: bash
        run: |
          docker run -d --name throne-ci --platform linux/amd64 throne-ci:amd64
          trap 'echo "::group::Container log"; docker logs throne-ci 2>&1; echo "::endgroup::"' EXIT
          deadline=$((SECONDS + 90))
          until docker exec throne-ci /opt/Throne/Throne --health >/dev/null 2>&1; do
            if [ "$(docker inspect -f '{{.State.Running}}' throne-ci)" != true ] || ((SECONDS >= deadline)); then
              docker exec throne-ci /opt/Throne/Throne --health || true
              echo "::error::the container did not report healthy within 90 s"
              exit 1
            fi
            sleep 1
          done
          docker exec throne-ci /opt/Throne/Throne --health
          docker exec throne-ci sh -c 'eval "$(/opt/Throne/Throne --print-connection)" && thronectl status'
          docker stop --time 45 throne-ci
          code=$(docker inspect -f '{{.State.ExitCode}}' throne-ci)
          if [ "$code" != 0 ]; then
            echo "::error::the container exited with $code after docker stop, not 0"
            exit 1
          fi
          if docker logs throne-ci 2>&1 | grep -nE 'HEADLESS-(DIALOG|WIDGET)|POLICY-UNBOUND'; then
            echo "::error::headless Throne reached a GUI-only path"
            exit 1
          fi
      - name: Logging in to ghcr.io
        if: steps.context.outputs.push == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pushing the image
        if: steps.context.outputs.push == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: docker/Dockerfile
          build-args: THRONE_API_REF=${{ env.THRONE_API_REF }}
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.context.outputs.tags }}
          push: true
  e2e-linux-scenarios:
    name: E2E Linux scenarios in containers
    runs-on: ubuntu-24.04
    needs:
      - build-cpp
    if: ${{ !cancelled() && needs.build-cpp.result != 'skipped' }}
    permissions:
      contents: read
    timeout-minutes: 75
    env:
      THRONE_DIR: ${{ github.workspace }}/deployment/linux-amd64
      THRONECTL: ${{ github.workspace }}/throne-api/thronectl
      FIXTURES: ${{ github.workspace }}/script/ci/smoke_fixtures.py
      E2E_TMP: ${{ github.workspace }}/e2e-tmp
      E2E_IMAGE: throne-e2e:amd64
    steps:
      - name: Checking the Throne-api ref is pushed
        run: |
          git init -q "$RUNNER_TEMP/throne-api-ref"
          git -C "$RUNNER_TEMP/throne-api-ref" fetch -q --depth=1 https://github.com/throneproj/Throne-api "$THRONE_API_REF" || { echo "::error::Throne-api $THRONE_API_REF is not on GitHub; push it first"; exit 1; }
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: Throne-${{ github.sha }}-linux-amd64
          path: download-artifact
      - name: Checking out Throne-api
        uses: actions/checkout@v7.0.1
        with:
          repository: throneproj/Throne-api
          ref: ${{ env.THRONE_API_REF }}
          path: throne-api
          persist-credentials: false
      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            throne-api/go.sum
      - name: Building thronectl
        working-directory: throne-api
        run: CGO_ENABLED=0 go build -trimpath -o "$THRONECTL" ./cmd/thronectl
      - name: Unpacking the build
        run: tar xzf download-artifact/artifacts.tgz
      # The release image, built from this deployment as docker-image builds it from the packed zip (the dockerignore
      # next to the Dockerfile leaves Throne.debug out), so the scenarios do not wait for pack. A failed build fails only
      # scenario 11, which then finds no $E2E_IMAGE; the other ten still run, and the job still fails.
      - name: Building the Docker image
        continue-on-error: true
        run: docker build -f docker/Dockerfile --build-arg THRONE_API_REF="$THRONE_API_REF" -t "$E2E_IMAGE" deployment
      - name: Running the scenarios
        timeout-minutes: 60
        run: bash ./script/ci/e2e/linux_scenarios.sh
      - name: Collecting the logs
        if: failure()
        run: |
          mkdir -p e2e-logs
          docker ps -a >e2e-logs/docker-ps.txt 2>&1 || true
          # Root-owned files and live sockets would fail the upload: copy the regular files, without keys and binaries.
          if [ -d "$E2E_TMP" ]; then
            (cd "$E2E_TMP" && sudo find . -type f -size -16M ! -name '*.key' -print0 | sudo tar -cf - --null -T -) | tar -xf - -C e2e-logs || true
          fi
      - name: Uploading the logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-linux-scenarios-logs
          path: e2e-logs
          if-no-files-found: ignore
          overwrite: true
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - pack
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Pack-${{ github.sha }}-*
          merge-multiple: true
          path: deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Deployment-${{ github.sha }}
          path: deployment
          compression-level: 0
      - name: Installing ghr
        run: |
          curl -Lo - https://github.com/tcnksm/ghr/releases/download/v0.17.0/ghr_v0.17.0_linux_amd64.tar.gz | tar xzv
          mv ghr*linux_amd64/ghr .
      # The changelog is written above the generated download table after publishing.
      - name: Generating release notes
        env:
          TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          sed "s|{{TAG}}|$TAG|g; s|{{REPO}}|$REPO|g" .github/release_template.md > "$RUNNER_TEMP/release.md"
      - name: PreRelease
        if: github.event.inputs.publish == 'p'
        run: |
          ./ghr -prerelease -delete -c ${{ github.sha }} -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" -b "$(cat "$RUNNER_TEMP/release.md")" "${{ github.event.inputs.tag }}" deployment
      - name: Release
        if: github.event.inputs.publish == 'r'
        run: |
          ./ghr -delete -c ${{ github.sha }} -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" -b "$(cat "$RUNNER_TEMP/release.md")" "${{ github.event.inputs.tag }}" deployment
